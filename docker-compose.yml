services:
  postgres:
    image: postgres:16-alpine
    container_name: syncboard-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-syncboard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-syncboard}
      POSTGRES_DB: ${POSTGRES_DB:-syncboard}
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-syncboard}"]
      interval: 5s
      timeout: 5s
      retries: 10

