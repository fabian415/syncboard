services:
  postgres:
    image: postgres:16-alpine
    container_name: syncboard-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-syncboard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-syncboard}
      POSTGRES_DB: ${POSTGRES_DB:-syncboard}
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-syncboard}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Dedicated LibreOffice conversion sidecar for Deep Dive PPTX playback.
  # Kept separate from clawpm-unoserver (a different compose project) —
  # distinct container name and no host port published, so it can't collide
  # with that container's name or its host-published :2003.
  unoserver:
    build:
      context: ./docker/unoserver
    image: syncboard-unoserver:latest
    container_name: syncboard-unoserver
    restart: unless-stopped
    expose:
      - "2003"
    # Published to the host (on 2004, since host :2003 is already taken by
    # the unrelated clawpm-unoserver project) so a backend running outside
    # Docker (local dev) can reach it directly instead of needing its own
    # LibreOffice/unoserver stack.
    ports:
      - "2004:2003"

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: syncboard-backend
    restart: unless-stopped
    env_file:
      - ./server/.env
    environment:
      NODE_ENV: production
      PORT: 3003
      DATABASE_URL: postgresql://${POSTGRES_USER:-syncboard}:${POSTGRES_PASSWORD:-syncboard}@postgres:5432/${POSTGRES_DB:-syncboard}?schema=public
      STORAGE_ROOT: ../storage
      UNOSERVER_HOST: unoserver
      UNOSERVER_PORT: 2003
    ports:
      - "3003:3003"
    volumes:
      - ./storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      unoserver:
        condition: service_started

volumes:
  pgdata:
